name: Deploy GitHub Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Type check
        run: npx tsc --noEmit
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static preview
        run: npm run build:preview
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Verify exported pages and assets
        run: npm run check:preview
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .cache/pages-preview/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
